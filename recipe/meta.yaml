{% set name = "shapicant" %}
{% set version = "0.4.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/shapicant-{{ version }}.tar.gz
  sha256: f711d37ad212e3f46dfc829d372f8337d6618b877e7da6640cdccfe0a30d5147

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - numpy
    - pandas
    - python >={{ python_min }}
    - scikit-learn
    - shap >=0.36.0
    - tqdm

test:
  requires:
    - python {{ python_min }}
  imports:
    - shapicant

about:
  home: https://github.com/manuel-calzolari/shapicant
  summary: Feature selection package based on SHAP and target permutation, for pandas and Spark
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - manuel-calzolari
